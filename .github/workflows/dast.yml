name: DAST

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly every Monday at 08:00 UTC (following SAST at 07:00 UTC)
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write

jobs:
  dast-zap:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build camstop container image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: camstop:dast

      - name: Start camstop service container
        run: |
          docker run -d \
            --name camstop-service \
            --network host \
            -v "${{ github.workspace }}/.zap/dast-config.yaml:/etc/camstop/camstop.yaml:ro" \
            camstop:dast

      - name: Verify camstop service readiness
        run: |
          echo "Waiting for camstop service to become healthy..."
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8080/healthz; then
              echo "camstop service is healthy and ready!"
              exit 0
            fi
            echo "Waiting for service (attempt $i/30)..."
            sleep 1
          done
          echo "Timed out waiting for camstop service"
          docker logs camstop-service
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-m 3 -T 5'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'

      - name: Stop camstop service container
        if: always()
        run: |
          echo "Container logs:"
          docker logs camstop-service || true
          docker stop camstop-service || true
          docker rm -f camstop-service || true
