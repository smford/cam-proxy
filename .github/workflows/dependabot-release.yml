name: Dependabot Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  dependabot-release:
    name: Build & Publish Dependabot Release
    runs-on: ubuntu-latest
    if: |
      github.actor == 'dependabot[bot]' ||
      github.event.head_commit.author.username == 'dependabot[bot]' ||
      contains(github.event.head_commit.author.email, 'dependabot[bot]') ||
      (startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, 'dependabot/'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Calculate Next Patch Version
        id: next_version
        run: |
          git fetch --tags
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          v=${latest#v}
          major=$(echo $v | cut -d. -f1)
          minor=$(echo $v | cut -d. -f2)
          patch=$(echo $v | cut -d. -f3)
          next="v${major}.${minor}.$((patch + 1))"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Calculated next release tag: $next"

      - name: Create and Push Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tag="${{ steps.next_version.outputs.tag }}"
          git tag -a "$tag" -m "Release $tag: Automated dependabot update"
          git push origin "$tag"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
