version: 2

project_name: camstop

before:
  hooks:
    - go mod tidy

builds:
  - id: camstop
    main: ./cmd/camstop
    binary: camstop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE*
      - README*
      - config.example.yaml

dockers_v2:
  - id: camstop
    images:
      - "ghcr.io/smford/camstop"
    tags:
      - "latest"
      - "{{ .Tag }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "v{{ .Major }}"
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: smford
    name: camstop
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## camstop {{ .Tag }} ({{ .Date }})

    Welcome to the latest release of `camstop`!
