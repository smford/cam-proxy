version: 2

project_name: cam-proxy

before:
  hooks:
    - go mod tidy

builds:
  - id: cam-proxy
    main: ./cmd/cam-proxy
    binary: cam-proxy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE*
      - README*
      - config.example.yaml
      - systemd/cam-proxy.service
      - docs/*

homebrew_casks:
  - name: cam-proxy
    repository:
      owner: smford
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: false
    directory: Casks
    homepage: "https://github.com/smford/cam-proxy"
    description: "Lightweight edge camera gateway — snapshots, PTZ control, and ONVIF-to-MQTT events"
    license: "MIT"

dockers_v2:
  - id: cam-proxy
    images:
      - "ghcr.io/smford/cam-proxy"
    tags:
      - "latest"
      - "{{ .Tag }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "v{{ .Major }}"
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: smford
    name: cam-proxy
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## cam-proxy {{ .Tag }} ({{ .Date }})

    Welcome to the latest release of `cam-proxy`!
