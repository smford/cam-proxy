# cam-proxy configuration specification
# Lightweight edge camera gateway for snapshots, PTZ, and ONVIF-to-MQTT events.

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 10s
  write_timeout: 15s
  snapshot_cache_ttl: 1s                            # In-memory snapshot cache TTL (coalesces rapid dashboard reloads)

mqtt:
  enabled: true
  broker: "tcp://192.168.1.50:1883"
  client_id: "cam-proxy-daemon"
  username: "mqtt_user"
  password: "mqtt_password"
  topic_prefix: "cam-proxy/events"
  keep_alive: 30s
  discovery: true                                   # Publish Home Assistant MQTT auto-discovery on startup
  discovery_prefix: "homeassistant"                 # Home Assistant MQTT discovery prefix

discovery:
  enabled: false
  interval: 5m

cameras:
  front_door:
    name: "Front Door Porch"
    address: "192.168.1.101:80"                      # ONVIF SOAP endpoint (host:port or IP)
    rtsp_url: "rtsp://admin:secret@192.168.1.101:554/h264Preview_01_main"
    onvif_username: "admin"
    onvif_password: "CameraPassword123"
    snapshot_method: "auto"                          # Options: "auto", "onvif", "rtsp"
    pull_events: true                                # Subscribe to ONVIF PullPoint notifications
    profile_token: ""                                # Optional; defaults to first active media profile
    snapshot_cache_ttl: 500ms                        # Optional per-camera cache TTL override (0s disables)

  backyard_ptz:
    name: "Backyard PTZ"
    address: "192.168.1.102:80"
    rtsp_url: "rtsp://admin:secret@192.168.1.102:554/onvif1"
    onvif_username: "admin"
    onvif_password: "CameraPassword123"
    snapshot_method: "onvif"
    pull_events: true
    profile_token: "Profile_1"

  garage_substream:
    name: "Garage Substream (MJPEG/RTSP)"
    address: "192.168.1.103:80"
    rtsp_url: "rtsp://admin:secret@192.168.1.103:554/mjpeg"
    onvif_username: "admin"
    onvif_password: "CameraPassword123"
    snapshot_method: "rtsp"
    pull_events: false
