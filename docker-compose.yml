services:
  cam-proxy:
    image: ghcr.io/smford/cam-proxy:latest
    container_name: cam-proxy
    restart: unless-stopped
    # host networking is recommended for ONVIF WS-Discovery (multicast UDP 239.255.255.250:3702)
    network_mode: host
    # If not using host networking, uncomment ports below:
    # ports:
    #   - "8080:8080"
    volumes:
      - ./cam-proxy.yaml:/etc/cam-proxy/cam-proxy.yaml:ro
    environment:
      - TZ=UTC
